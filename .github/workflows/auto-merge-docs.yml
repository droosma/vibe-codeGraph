name: Auto-merge documentation PRs

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Docs"]
    types: [completed]
  pull_request:
    types: [opened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  auto-merge:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'documentation') ||
         (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'documentation'))))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process all open doc PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PRS=$(gh pr list --repo "${{ github.repository }}" \
            --state open --label documentation --author 'github-actions[bot]' \
            --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"')

          if [ -z "$PRS" ]; then
            echo "No open documentation PRs found"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "$PRS" | while read -r PR_NUMBER HEAD_REF; do
            echo "::group::Processing PR #$PR_NUMBER ($HEAD_REF)"

            # Mark draft as ready
            DRAFT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
            if [ "$DRAFT" = "true" ]; then
              echo "Marking PR #$PR_NUMBER as ready for review"
              gh pr ready "$PR_NUMBER" --repo "${{ github.repository }}" || true
            fi

            # Rebase onto main
            git fetch origin "$HEAD_REF" main
            git checkout "$HEAD_REF"
            git rebase origin/main || {
              echo "Rebase conflicts — falling back to merge with theirs strategy"
              git rebase --abort
              git merge origin/main --strategy-option theirs --no-edit || true
            }
            git push --force-with-lease origin HEAD || true

            # Set the CI Gate status check as success (bot PRs don't trigger CI)
            HEAD_SHA=$(git rev-parse HEAD)
            gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
              -f state=success \
              -f context="CI Gate" \
              -f description="Docs-only PR — CI skipped" || true

            # Give GitHub time to propagate the status check
            sleep 5

            # Approve (will fail for self-authored PRs, that's fine)
            gh pr review "$PR_NUMBER" --repo "${{ github.repository }}" --approve 2>/dev/null || true

            # Merge
            if gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --delete-branch --admin; then
              echo "✅ PR #$PR_NUMBER merged successfully"
            else
              echo "⚠️ PR #$PR_NUMBER could not be merged — will retry on next trigger"
            fi

            echo "::endgroup::"
          done
