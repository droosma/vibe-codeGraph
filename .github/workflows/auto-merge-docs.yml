name: Auto-merge documentation PRs

on:
  pull_request:
    types: [opened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'documentation') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'documentation'))
    runs-on: ubuntu-latest
    steps:
      - name: Mark draft PR as ready
        if: github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready ${{ github.event.pull_request.number }} --repo ${{ github.repository }}

      - name: Approve PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --approve

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --auto --squash
