name: Auto-merge documentation PRs

on:
  pull_request:
    types: [opened, labeled, ready_for_review]
  workflow_run:
    workflows: ["Update Docs"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      (github.event_name == 'pull_request' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'documentation') ||
         (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'documentation')))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Find doc PR from workflow run
        if: github.event_name == 'workflow_run'
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --repo ${{ github.repository }} --state open --label documentation --author 'github-actions[bot]' --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open documentation PR found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "number=${{ steps.find-pr.outputs.pr }}" >> "$GITHUB_OUTPUT"
            echo "should_run=${{ steps.find-pr.outputs.found }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark draft PR as ready
        if: steps.pr.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json isDraft --jq '.isDraft')
          if [ "$DRAFT" = "true" ]; then
            gh pr ready ${{ steps.pr.outputs.number }} --repo ${{ github.repository }}
          fi

      - name: Checkout PR branch for rebase
        if: steps.pr.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && '' || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch and set PR branch ref
        if: steps.pr.outputs.should_run == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REF=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Rebase onto main
        if: steps.pr.outputs.should_run == 'true'
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main || {
            echo "Rebase had conflicts — attempting auto-resolution with ours strategy"
            git rebase --abort
            git merge origin/main --strategy-option theirs --no-edit
          }
          git push --force-with-lease origin HEAD

      - name: Approve PR
        if: steps.pr.outputs.should_run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --approve

      - name: Merge PR
        if: steps.pr.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --squash --admin
